{% extends "sugarfreecat/layout.html" %}
{% load static %}

{% block content %}
        <h3 class="bubble">Monthly Archive: {{ archive_date|date:"F, Y" }}</h3>

        <ul class="custom-icon">
            {% for post in posts %}
                <li>
                    <a href="{% url 'post' post.id %}">{{ post.pub_date|date:"M d, Y" }} >> {{ post.title }}</a>
                </li>
            {% endfor %}
        </ul>
{% endblock %}
