{% extends "sugarfreecat/layout.html" %}
{% load static %}

{% block content %}
    {% for group in posts_by_month %}
        <h3 class="bubble">{{ group.month|date:"F, Y" }}</h3>

        <ul class="custom-icon">
            {% for post in group.posts %}
                <li>
                    <a href="{% url 'post' post.id %}">{{ post.pub_date|date:"M d, Y" }} >> {{ post.title }}</a>
                </li>
            {% endfor %}
        </ul>
    {% endfor %}
{% endblock %}
