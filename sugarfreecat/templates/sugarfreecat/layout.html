{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <title>SugarFreeCat</title>
    <meta charset="utf-8">
    <link rel="icon" type="image/png" href="{% static 'sugarfreecat/images/favicon.png' %}">
    
    <link rel="stylesheet" href="{% static 'sugarfreecat/css/layout.css' %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Concert+One&family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <script>
      const savedTheme = localStorage.getItem('theme');

      if (savedTheme) {
          document.documentElement.dataset.theme = savedTheme;
      }
    </script>
    {% block style %}
    {% endblock %}
  </head>
  <body class="is-loading">
    <div class="full-page">
      <h1 id="title-banner" class="bubble">S U G A R F R E E C A T</h1>
      
      <div class="container">
        <div class="tabs">
            {% for tab in tabs %}
                <a class="button-link link" href="{% url tab.link %}">
                    <div class="button">
                        <p data-content="{{ tab.text }}">{{ tab.text }}</p>
                    </div>
                </a>
            {% endfor %}
        </div>
        <div class="column no-scrollbar">
          {% block content %}
          {% endblock %}
        </div>
      </div>
    </div>
    <div id="lastUpdated"><div>☆*:.｡.o(≧▽≦)o.｡.:*☆`</div></div>
    
    <script>
      const clickExplosionImg = "{% static 'sugarfreecat/images/deco5.gif' %}";
  </script>
    {% block scripts %}
    {% endblock %}
    <script src="{% static 'sugarfreecat/js/script.js' %}" type="module"></script>
    <script src="{% static 'sugarfreecat/js/cursor_particles.js' %}"></script>
    <script src="{% static 'sugarfreecat/js/click_explosion.js' %}"></script>
    <script src="{% static 'sugarfreecat/js/bubbleText.js' %}"></script>
    <script>
      function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }
      //from: https://stackoverflow.com/a/39914235/14251221

      var str = 'sugarfreecat';
      document.title = '';
      async function typewriteTitle() {
        while (true) {
          document.title = '';
          for (const char of str) {
            document.title += char;
            await sleep(325);
          }

        }
      }
      typewriteTitle();
    </script>
  </body>
</html>
