{% extends "sugarfreecat/layout.html" %}
{% load static %}
{% block style %}
    <link rel="stylesheet" href="{% static 'sugarfreecat/css/theme.css' %}">
{% endblock %}
{% block content %}
    <div class="theme-container">
        <div>
            <h3 class="bubble">Pick your theme!</h3>
            <ul class="custom-icon theme-list">
                <li>
                    <p class="theme-option" data-theme-content="strawberry-explosion" data-content="strawberry-explosion">strawberry explosion</p>
                </li>
                <li>
                    <p class="theme-option" data-theme-content="ghost-town" data-content="ghost-town">ghost town</p>
                </li>
                <li>
                    <p class="theme-option" data-theme-content="cherry-blossom" data-content="cherry blossom">cherry blossom</p>
                </li>
                <li>
                    <p class="theme-option" data-theme-content="snowflakes" data-content="snowflakes">snowflakes</p>
                </li>
            </ul>
        </div>

        <div id="reset-btn" class="reset-btn">
            Reset to Default!
        </div>
    </div>
{% endblock %}

{% block scripts %}
    <script src="{% static 'sugarfreecat/js/theme.js' %}" type="module"></script>
{% endblock %}
