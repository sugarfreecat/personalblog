{% extends "sugarfreecat/layout.html" %}
{% load static %}
{% block style %}
    <link rel="stylesheet" href="{% static 'sugarfreecat/css/theme.css' %}">
{% endblock %}
{% block content %}
    <h3 class="bubble">Pick your cursor!</h3>
    <div id="cursor-gallery" class="cursor-gallery">
    </div>

    <h3 class="bubble">Pick your background!</h3>
    <div id="background-gallery" class="background-gallery">
    </div>

    <h3 class="bubble">Pick your button!</h3>
    <div id="button-gallery" class="button-gallery">
    </div>

    <h3 class="bubble">Pick your border!</h3>
    <div id="border-gallery" class="border-gallery">
    </div>
    <div id="reset-btn" class="reset-btn">
        Reset to Default!
    </div>
{% endblock %}

{% block scripts %}
    <script src="{% static 'sugarfreecat/js/theme.js' %}" type="module"></script>
{% endblock %}
